name: Build VoidX APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore release keystore (only if secret is set)
        env:
          KS_B64: ${{ secrets.VOIDX_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 --decode > "$RUNNER_TEMP/voidx-release.jks"
            echo "VOIDX_KEYSTORE_PATH=$RUNNER_TEMP/voidx-release.jks" >> "$GITHUB_ENV"
          fi

      - name: Build debug and release APKs
        env:
          VOIDX_KEYSTORE_PASSWORD: ${{ secrets.VOIDX_KEYSTORE_PASSWORD }}
          VOIDX_KEY_ALIAS: ${{ secrets.VOIDX_KEY_ALIAS }}
          VOIDX_KEY_PASSWORD: ${{ secrets.VOIDX_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleDebug :app:assembleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: VoidX-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: VoidX-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
